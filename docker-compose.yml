name: atrio-leilao

x-node-env: &node-env
  PORT: 3000
  DATA_DIR: /data
  CLUSTER_NODES: "1=http://node1:3000,2=http://node2:3000,3=http://node3:3000,4=http://node4:3000,5=http://node5:3000"
  CONTROL_TOKEN: "${CONTROL_TOKEN:?Configure CONTROL_TOKEN no arquivo .env}"
  CLUSTER_INITIAL_ACTIVE: "1,2,3"

x-node: &node-base
  build:
    context: .
    target: backend
  restart: unless-stopped
  networks: [leilao]

services:
  node1:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 1
    volumes: ["node1_data:/data"]
  node2:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 2
    volumes: ["node2_data:/data"]
  node3:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 3
    volumes: ["node3_data:/data"]
  node4:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 4
    volumes: ["node4_data:/data"]
  node5:
    <<: *node-base
    environment:
      <<: *node-env
      NODE_ID: 5
    volumes: ["node5_data:/data"]
  dashboard:
    <<: *node-base
    build:
      context: .
      target: dashboard
    command: ["node", "backend/gateway/server.js"]
    environment:
      <<: *node-env
      PORT: 8080
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@atrio.local}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no arquivo .env}"
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["dashboard_data:/data"]
    depends_on: [node1, node2, node3, node4, node5]

networks:
  leilao:
    driver: bridge
volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
  dashboard_data:
